[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

[dev]
  command = "npm run dev"
  framework = "#custom"
  targetPort = 3000
  port = 8888
  autoLaunch = false
